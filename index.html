<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17458F">
<title>로타리 사무국 도우미</title>
<style>
:root{--blue:#17458F;--gold:#F7A81B;--bg:#f2f5fa;--line:#dde3ec;--txt:#1a2433;--mut:#687386;--ok:#2e9d5b;--red:#d14343;--amber:#c98100}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{background:var(--blue);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}
header h1{font-size:18px;margin:0}
header .sub{font-size:12px;opacity:.8}
.modesw{margin-left:auto;display:flex;background:rgba(255,255,255,.15);border-radius:20px;padding:3px}
.modesw button{border:0;background:none;color:#fff;padding:6px 14px;border-radius:16px;cursor:pointer;font:inherit;font-size:14px}
.modesw button.on{background:#fff;color:var(--blue);font-weight:700}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;position:sticky;top:0;z-index:4}
nav button{border:0;background:none;padding:12px 13px;font-size:15px;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--blue);border-color:var(--gold);font-weight:700}
main{padding:14px;max-width:1280px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px}
.stat span{font-size:12px;color:var(--mut)}.stat b{display:block;font-size:22px;margin-top:2px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{background:#f6f8fc;font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
textarea{min-height:70px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.btn{border:0;border-radius:8px;padding:8px 13px;font:inherit;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap}
.btn.g{background:#e8edf5;color:var(--txt)}.btn.r{background:var(--red)}.btn.y{background:var(--gold);color:#222}
.btn.sm{padding:4px 9px;font-size:13px}
a.btn{text-decoration:none;display:inline-block}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:#eef1f6;color:#44506a;margin-right:3px}
.tag.ok{background:#dff3e7;color:#1d6b3e}.tag.no{background:#ffe3e3;color:#9a1c1c}.tag.w{background:#fff1d0;color:#7a5200}
.muted{color:var(--mut);font-size:12px}
.note{background:#f4f8ff;border:1px solid #cddcf5;color:#27466f;padding:8px 10px;border-radius:8px;font-size:13px;margin:6px 0}
.scroll{max-height:520px;overflow:auto}
.att{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.att button{border:0;background:#fff;padding:5px 9px;cursor:pointer;font:inherit;font-size:13px}
.att button.on.P{background:var(--ok);color:#fff}.att button.on.M{background:#3b82c4;color:#fff}.att button.on.A{background:var(--red);color:#fff}.att button.on.E{background:#8a93a3;color:#fff}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.chk input{width:auto}.chk.done span{text-decoration:line-through;color:var(--mut)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:30px 10px}
.modal{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:18px}
.modal h2{margin:0 0 12px;font-size:18px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;display:none;z-index:60}
#lock{position:fixed;inset:0;background:var(--blue);display:none;align-items:center;justify-content:center;z-index:50}
#lock .box{background:#fff;padding:24px;border-radius:12px;width:280px;text-align:center}
.hide{display:none}
#print{display:none}
@media print{body>*{display:none!important}#print{display:block!important;padding:10mm;font-size:12pt}#print table{font-size:11pt}#print th{position:static}}
</style>
</head>

  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('복사했습니다. 문자·카톡에 붙여 넣으세요')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('복사했습니다')}}
function pickFiles(accept,multiple,cb){const f=$('#filePick');f.accept=accept;f.multiple=multiple;f.value='';f.onchange=()=>cb([...f.files]);f.click()}
const readText=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file,'utf-8')});

function monthAttendance(month){
  const ms=DB.meetings.filter(m=>m.type==='정기주회'&&m.date.startsWith(month));
  let pm=0,elig=0;
  ms.forEach(m=>{Object.values(m.att||{}).forEach(v=>{if(v==='E')return;elig++;if(v==='P'||v==='M')pm++})});
  return {meetings:ms.length,pm,elig,rate:elig?Math.round(pm/elig*1000)/10:null};
}
function memberAttendance(id,label){const [a,b]=ryRange(label);let pm=0,el=0;
  DB.meetings.filter(m=>m.type==='정기주회'&&m.date>=a&&m.date<=b).forEach(m=>{const v=(m.att||{})[id];if(!v||v==='E')return;el++;if(v==='P'||v==='M')pm++});
  return el?Math.round(pm/el*1000)/10:null}
function memberBalance(id,label){const cs=DB.charges.filter(c=>c.memberId===id&&(!label||c.year===label));
  const ch=cs.reduce((a,c)=>a+(+c.amount||0),0),pd=cs.reduce((a,c)=>a+(+c.paid||0),0);return {ch,pd,bal:ch-pd}}

  if(id)$('#gDel').onclick=()=>{if(!confirm('이 회의 기록을 삭제할까요?'))return;DB.meetings=DB.meetings.filter(x=>x.id!==id);save();closeModal();render()};}

/* ============ 클럽: 회비·기부 ============ */
let monYear=ry();
VIEWS.money=()=>{const act=DB.members.filter(m=>m.status!=='퇴회'||DB.charges.some(c=>c.memberId===m.id&&c.year===monYear)).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const rows=act.map(m=>({m,...memberBalance(m.id,monYear)}));const tot=rows.reduce((a,r)=>({ch:a.ch+r.ch,pd:a.pd+r.pd}),{ch:0,pd:0});
  const don=DB.donations.filter(x=>ry(x.date)===monYear).sort((a,b)=>b.date.localeCompare(a.date));

    <button class="btn" id="yCh">회비 일괄 부과</button><button class="btn g" id="yUn">미납 안내문 복사</button><button class="btn g" id="yCsv">회비 CSV</button></div>
    <div class="stats" style="margin-top:10px"><div class="stat"><span>부과</span><b>${won(tot.ch)}</b></div><div class="stat"><span>납부</span><b style="color:var(--ok)">${won(tot.pd)}</b></div><div class="stat"><span>미납</span><b style="color:var(--red)">${won(tot.ch-tot.pd)}</b></div><div class="stat"><span>수납률</span><b>${tot.ch?Math.round(tot.pd/tot.ch*100)+'%':'-'}</b></div></div>
    <div class="scroll"><table><tr><th>이름</th><th>상태</th><th class="num">부과</th><th class="num">납부</th><th class="num">잔액</th><th></th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.m.name)}</td><td>${r.m.status}</td><td class="num">${won(r.ch)}</td><td class="num">${won(r.pd)}</td><td class="num" style="${r.ch-r.pd>0?'color:var(--red);font-weight:700':''}">${won(r.ch-r.pd)}</td><td><button class="btn g sm" data-pay="${r.m.id}">납부 기록</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">회원이 없습니다.</td></tr>'}</table></div></div>
  <div class="card"><div class="row"><h3 style="margin:0">재단·기부 기록 (${monYear})</h3><button class="btn" id="dAdd" style="margin-left:auto">＋ 기부 기록</button><button class="btn g" id="dCsv">기부 CSV</button></div>
    <div style="margin:8px 0">${Object.entries(byFund).map(([k,v])=>`<span class="tag">${esc(k)} ${k.endsWith('USD')?usd(v):won(v)}</span>`).join('')||'<span class="muted">기록 없음</span>'}</div>
    <div class="note">클럽 내부 관리용 기록입니다. 기부 인정(PHF 등)의 공식 기준은 My Rotary·재단 보고서가 우선입니다.</div>
    <div class="scroll"><table><tr><th>날짜</th><th>회원</th><th>기금</th><th class="num">금액</th><th>메모</th><th></th></tr>${don.map(x=>`<tr><td>${x.date}</td><td>${esc(memOf(x.memberId)?.name||'클럽')}</td><td>${esc(x.fund)}</td><td class="num">${x.currency==='USD'?usd(x.amount):won(x.amount)}</td><td class="muted">${esc(x.memo)}</td><td><button class="btn g sm" data-dd="${x.id}">삭제</button></td></tr>`).join('')}</table></div></div>`;
  $('#yY').onchange=e=>{monYear=e.target.value;VIEWS.money()};
  $('#yCh').onclick=()=>{openModal(`<h2>회비 일괄 부과 (정회원 ${activeMembers().length}명)</h2><div class="g3"><div><label>로타리연도</label><input id="cY" value="${monYear}"></div>
     <div><label>항목</label><select id="cK">${['연회비','상반기 회비','하반기 회비','분기 회비','입회비','특별회비','기타'].map(k=>`<option>${k}</option>`).join('')}</select></div><div><label>1인 금액(원)</label><input id="cA" type="number" step="10000"></div></div>
     <div class="note">이미 같은 연도·항목이 부과된 회원은 건너뜁니다. 명예회원·휴회 회원은 부과하지 않습니다.</div>
     <div class="foot"><button class="btn g" onclick="closeModal()">취소</button><button class="btn" id="cOk">부과</button></div>`);
    $('#cOk').onclick=()=>{const y=$('#cY').value.trim(),k=$('#cK').value,a=+$('#cA').value;if(!a)return alert('금액을 입력하세요');let n=0;
      activeMembers().forEach(m=>{if(DB.charges.some(c=>c.memberId===m.id&&c.year===y&&c.kind===k))return;DB.charges.push({id:uid(),memberId:m.id,year:y,kind:k,amount:a,paid:0,paidAt:'',memo:''});n++});
      save();closeModal();render();toast(`${n}명에게 ${k} 부과`)}};
  $$('[data-pay]').forEach(b=>b.onclick=()=>payForm(b.dataset.pay));
  $('#yUn').onclick=()=>{const un=rows.filter(r=>r.ch-r.pd>0);if(!un.length)return toast('미납자가 없습니다');
    const txt=un.map(r=>`[${S().clubName}] ${r.m.name} 회원님, ${monYear} 회비 미납액 ${won(r.ch-r.pd)} 안내드립니다.${S().bank?' 입금 계좌: '+S().bank:''} 이미 납부하셨다면 양해 부탁드립니다.`).join('\n\n');
    openModal(`<h2>미납 안내문 (${un.length}명)</h2><p class="muted">자동 발송하지 않습니다. 복사해서 문자·카톡으로 보내세요.</p><textarea id="unT" style="min-height:300px">${esc(txt)}</textarea><div class="foot"><button class="btn g" onclick="closeModal()">닫기</button><button class="btn" id="unC">전체 복사</button></div>`);
    $('#unC').onclick=()=>copyText($('#unT').value)};
  $('#yCsv').onclick=()=>dl(`${S().clubName}_회비_${monYear}.csv`,toCsv([['이름','항목','부과','납부','잔액','납부일','메모'],...DB.charges.filter(c=>c.year===monYear).map(c=>[memOf(c.memberId)?.name||'',c.kind,c.amount,c.paid,c.amount-c.paid,c.paidAt,c.memo])]),'text/csv');
  $('#dAdd').onclick=donationForm;
  $('#dCsv').onclick=()=>dl(`${S().clubName}_기부_${monYear}.csv`,toCsv([['날짜','회원','기금','통화','금액','메모'],...don.map(x=>[x.date,memOf(x.memberId)?.name||'클럽',x.fund,x.currency,x.amount,x.memo])]),'text/csv');
  $$('[data-dd]').forEach(b=>b.onclick=()=>{if(!confirm('이 기부 기록을 삭제할까요?'))return;DB.donations=DB.donations.filter(x=>x.id!==b.dataset.dd);save();render()});
};
function payForm(mid){const m=memOf(mid);const cs=DB.charges.filter(c=>c.memberId===mid&&c.year===monYear);
  openModal(`<h2>${esc(m.name)} · ${monYear} 회비</h2>${cs.length?`<table><tr><th>항목</th><th class="num">부과</th><th>납부액</th><th>납부일</th><th>메모</th></tr>${cs.map(c=>`<tr><td>${esc(c.kind)}</td><td class="num">${won(c.amount)}</td><td><input type="number" data-pa="${c.id}" value="${c.paid}" step="10000"></td><td><input type="date" data-pd="${c.id}" value="${c.paidAt}"></td><td><input data-pm="${c.id}" value="${esc(c.memo)}"></td></tr>`).join('')}</table>`:'<p class="muted">부과된 회비가 없습니다.</p>'}
   <div class="g3" style="margin-top:10px"><div><label>개별 항목 추가</label><input id="xK" placeholder="예: 특별회비"></div><div><label>금액</label><input id="xA" type="number" step="10000"></div><div style="align-self:end"><button class="btn g" id="xAdd" style="width:100%">추가</button></div></div>
   <div class="foot"><button class="btn g" id="pFull">전액 납부 처리</button><button class="btn g" onclick="closeModal()">닫기</button><button class="btn" id="pOk">저장</button></div>`);
  const apply=()=>cs.forEach(c=>{c.paid=+$(`[data-pa="${c.id}"]`).value||0;c.paidAt=$(`[data-pd="${c.id}"]`).value;c.memo=$(`[data-pm="${c.id}"]`).value});
  $('#pOk').onclick=()=>{apply();save();closeModal();render();toast('저장했습니다')};
  $('#pFull').onclick=()=>{cs.forEach(c=>{$(`[data-pa="${c.id}"]`).value=c.amount;if(!$(`[data-pd="${c.id}"]`).value)$(`[data-pd="${c.id}"]`).value=today()})};
  $('#xAdd').onclick=()=>{const k=$('#xK').value.trim(),a=+$('#xA').value;if(!k||!a)return;apply();DB.charges.push({id:uid(),memberId:mid,year:monYear,kind:k,amount:a,paid:0,paidAt:'',memo:''});save();payForm(mid)};}
function donationForm(){const mem=DB.members.filter(m=>m.status!=='퇴회').sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  openModal(`<h2>기부 기록</h2><div class="g3"><div><label>날짜</label><input id="nD" type="date" value="${today()}"></div>
   <div><label>회원</label><select id="nM"><option value="">클럽 명의</option>${mem.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>
   <div><label>기금</label><select id="nF">${FUNDS.map(f=>`<option>${f}</option>`).join('')}</select></div>
   <div><label>통화</label><select id="nC"><option>USD</option><option>KRW</option></select></div><div><label>금액</label><input id="nA" type="number" step="0.01"></div><div><label>메모</label><input id="nMe"></div></div>
   <div class="foot"><button class="btn g" onclick="closeModal()">취소</button><button class="btn" id="nOk">저장</button></div>`);
  $('#nOk').onclick=()=>{const a=+$('#nA').value;if(!a)return alert('금액을 입력하세요');DB.donations.push({id:uid(),date:$('#nD').value,memberId:$('#nM').value||null,fund:$('#nF').value,currency:$('#nC').value,amount:a,memo:$('#nMe').value});save();closeModal();render()};}

/* ============ 클럽: 일정·경조사 ============ */
VIEWS.cal=()=>{const up=DB.events.filter(e=>e.date>=ymd(Date.now()-30*864e5)).sort((a,b)=>a.date.localeCompare(b.date));
  $('#main').innerHTML=`<div class="card"><div class="row"><h3 style="margin:0">일정·경조사 (최근 30일 이후)</h3><button class="btn" id="eAdd" style="margin-left:auto">＋ 행사</button><button class="btn y" id="eAdd2">＋ 경조사</button></div>
   <div class="scroll" style="margin-top:10px"><table><tr><th>날짜</th><th>구분</th><th>내용</th><th>장소</th><th>관련 회원</th><th>처리</th><th></th></tr>
   ${up.map(e=>`<tr><td>${e.date}${e.time?' '+esc(e.time):''}</td><td>${e.kind==='경조사'?`<span class="tag w">${esc(e.subkind)}</span>`:'<span class="tag">행사</span>'}</td><td>${esc(e.title)}</td><td>${esc(e.place)}</td><td>${esc(memOf(e.memberId)?.name||'')}</td><td>${e.kind==='경조사'?(e.handled?'<span class="tag ok">완료</span>':'<span class="tag no">미처리</span>'):''}</td><td><button class="btn g sm" data-e="${e.id}">수정</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">일정이 없습니다.</td></tr>'}</table></div></div>`;
  $('#eAdd').onclick=()=>eventForm(null,'행사');$('#eAdd2').onclick=()=>eventForm(null,'경조사');
  $$('[data-e]').forEach(b=>b.onclick=()=>eventForm(b.dataset.e));};
function eventForm(id,kind){const e=id?DB.events.find(x=>x.id===id):{id:uid(),date:today(),time:'',kind,subkind:'부고',title:'',place:'',memberId:'',handled:false,memo:''};
  const mem=DB.members.filter(m=>m.status!=='퇴회').sort((a,b)=>a.name.localeCompare(b.name,'ko'));const g=e.kind==='경조사';
  openModal(`<h2>${g?'경조사':'행사·일정'}</h2><div class="g3"><div><label>날짜</label><input id="vD" type="date" value="${e.date}"></div><div><label>시간</label><input id="vT" type="time" value="${esc(e.time)}"></div>
   ${g?`<div><label>종류</label><select id="vS">${['부고','결혼','개업·취임','입원·병문안','기타'].map(s=>`<option ${s===e.subkind?'selected':''}>${s}</option>`).join('')}</select></div>`:'<div></div>'}</div>
   <div class="g2" style="margin-top:8px"><div><label>내용</label><input id="vTi" value="${esc(e.title)}" placeholder="${g?'예: 부친상, 자녀 결혼':'예: 창립기념식, 지구대회'}"></div><div><label>장소</label><input id="vP" value="${esc(e.place)}"></div>
   <div><label>관련 회원</label><select id="vM"><option value="">없음</option>${mem.map(m=>`<option value="${m.id}" ${m.id===e.memberId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
   ${g?`<div style="align-self:end"><label style="font-size:14px;color:var(--txt)"><input type="checkbox" id="vH" style="width:auto" ${e.handled?'checked':''}> 화환·부조·알림 처리 완료</label></div>`:''}</div>
   <label style="margin-top:8px">메모</label><textarea id="vMe">${esc(e.memo)}</textarea>
   ${g?'<div class="foot" style="justify-content:flex-start"><button class="btn g" id="vCopy">회원 알림 문구 복사</button></div>':''}
   <div class="foot">${id?'<button class="btn r" id="vDel">삭제</button>':''}<button class="btn g" onclick="closeModal()">닫기</button><button class="btn" id="vOk">저장</button></div>`);
  const col=()=>Object.assign(e,{date:$('#vD').value,time:$('#vT').value,title:$('#vTi').value,place:$('#vP').value,memberId:$('#vM').value,memo:$('#vMe').value,...(g?{subkind:$('#vS').value,handled:$('#vH').checked}:{})});
  $('#vOk').onclick=()=>{col();if(!id)DB.events.push(e);save();closeModal();render()};
  if(g)$('#vCopy').onclick=()=>{col();const n=memOf(e.memberId)?.name||'';copyText(`[${S().clubName} ${e.subkind} 알림]\n${n?n+' 회원 ':''}${e.title}\n일시: ${e.date}${e.time?' '+e.time:''}\n장소: ${e.place}\n${e.memo}`.trim())};
  if(id)$('#vDel').onclick=()=>{if(!confirm('삭제할까요?'))return;DB.events=DB.events.filter(x=>x.id!==id);save();closeModal();render()};}

/* ============ 공문 대장 (클럽·지구 공용) ============ */

   <p class="muted">발신 번호는 「${isDistrict?S().district+'지구':S().clubName}-${ry()}-일련번호」로 자동 부여됩니다.${isDistrict?' 발신 공문은 클럽별 수신 확인을 체크할 수 있습니다.':''}</p>
   <div class="scroll"><table><tr><th>구분</th><th>문서번호</th><th>일자</th><th>${isDistrict?'수신·발신처':'발신처→수신처'}</th><th>제목</th><th>회신기한</th><th>상태</th>${isDistrict?'<th>수신 확인</th>':''}<th></th></tr>
   ${list.map(d=>`<tr><td><span class="tag ${d.dir==='발신'?'':'w'}">${d.dir}</span></td><td>${esc(d.no)}</td><td>${d.date}</td><td>${esc(d.from)} → ${esc(d.to)}</td><td>${esc(d.title)}</td><td>${d.due?`<span class="tag ${d.status!=='완료'&&d.due<today()?'no':''}">${d.due}</span>`:''}</td><td>${d.status}</td>${isDistrict?`<td>${d.dir==='발신'?`${Object.keys(d.receipts||{}).length}/${DB.d.clubs.length}`:''}</td>`:''}<td><button class="btn g sm" data-e="${d.id}">열기</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">공문이 없습니다.</td></tr>'}</table></div></div>`;

let repMonth=thisMonth();
function buildReport(month){const [y,mo]=month.split('-').map(Number);const first=`${month}-01`,last=ymd(new Date(y,mo,0));
  const a=monthAttendance(month);
  const joined=DB.members.filter(m=>m.joined>=first&&m.joined<=last).map(m=>m.name);
  const left=DB.members.filter(m=>m.status==='퇴회'&&m.leftAt>=first&&m.leftAt<=last).map(m=>m.name);
  const don=DB.donations.filter(x=>x.date>=first&&x.date<=last);
  const events=DB.events.filter(e=>e.kind==='행사'&&e.date>=first&&e.date<=last).map(e=>`${e.date} ${e.title}`);
  return {type:'rotary-club-monthly-report',version:1,district:S().district,clubCode:S().clubCode,clubName:S().clubName,month,
    memberCount:activeMembers().length,honoraryCount:DB.members.filter(m=>m.status==='명예회원').length,
    newMembers:joined,leftMembers:left,meetings:a.meetings,attendanceRate:a.rate,
    donationsUSD:Math.round(don.filter(x=>x.currency==='USD').reduce((s,x)=>s+(+x.amount||0),0)*100)/100,
    donationsKRW:don.filter(x=>x.currency==='KRW').reduce((s,x)=>s+(+x.amount||0),0),activities:events,note:'',createdAt:new Date().toISOString()}}
VIEWS.report=()=>{const r=buildReport(repMonth);
  const text=`[${r.clubName} ${r.month} 월간 보고]\n정회원 ${r.memberCount}명 (명예회원 ${r.honoraryCount}명)\n신입 ${r.newMembers.length}명${r.newMembers.length?': '+r.newMembers.join(', '):''}\n퇴회 ${r.leftMembers.length}명${r.leftMembers.length?': '+r.leftMembers.join(', '):''}\n정기주회 ${r.meetings}회 · 출석률 ${r.attendanceRate===null?'-':r.attendanceRate+'%'}\n재단 기부 ${usd(r.donationsUSD)}${r.donationsKRW?' / '+won(r.donationsKRW):''}\n주요 활동: ${r.activities.join(' / ')||'-'}`;
  $('#main').innerHTML=`<div class="card"><div class="row"><label style="margin:0">보고 월</label><input type="month" id="rM" value="${repMonth}" style="width:auto"></div>
   <div class="note">회원명부·출석·기부·일정에 입력한 내용으로 자동 작성됩니다. 지구 사무국이 이 앱을 쓰면 <b>보고 파일(JSON)</b>을 보내고, 아니면 <b>문구 복사</b>로 카톡·메일에 붙이세요. 지구가 정한 양식이 따로 있으면 그 양식이 우선입니다.</div>
   <div class="cols" style="margin-top:10px"><div><label>비고 (지구에 전달할 말)</label><textarea id="rNote" placeholder="예: 10월 봉사 행사 사진 별도 송부"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" id="rJson">보고 파일 받기 (JSON)</button><button class="btn g" id="rCopy">보고 문구 복사</button></div></div>
    <div><label>미리보기</label><pre id="rPre" style="white-space:pre-wrap;background:#f6f8fc;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin:0">${esc(text)}</pre></div></div></div>`;
  $('#rM').onchange=e=>{repMonth=e.target.value;VIEWS.report()};
  $('#rJson').onclick=()=>{r.note=$('#rNote').value;dl(`월간보고_${S().clubCode}_${S().clubName}_${repMonth}.json`,JSON.stringify(r,null,1),'application/json');toast('파일을 지구 사무국에 보내세요')};
  $('#rCopy').onclick=()=>copyText(text+($('#rNote').value?`\n비고: ${$('#rNote').value}`:''));};

VIEWS.dhome=()=>{const cl=DB.d.clubs,mo=thisMonth(),rep=DB.d.reports[mo]||{};const sub=cl.filter(c=>rep[c.code]).length;
  const regions=[...new Set(cl.map(c=>c.region))];const tot=cl.reduce((a,c)=>a+(+c.members||0),0);
  const fy=DB.d.fees[ry()];const fee=fy?cl.reduce((a,c)=>{const due=(+fy.perHead||0)*(+c.members||0)+(+(fy.extra||0));const p=+(fy.byClub?.[c.code]?.paid||0);return {due:a.due+due,paid:a.paid+p}},{due:0,paid:0}):null;

   <div class="card"><h3>지역별 회원 현황</h3><table><tr><th>지역</th><th class="num">클럽</th><th class="num">회원</th><th class="num">${mo} 보고</th></tr>
   ${regions.map(r=>{const cs=cl.filter(c=>c.region===r);return `<tr><td>${esc(r)}</td><td class="num">${cs.length}</td><td class="num">${num(cs.reduce((a,c)=>a+(+c.members||0),0))}</td><td class="num">${cs.filter(c=>rep[c.code]).length}/${cs.length}</td></tr>`}).join('')}
   <tr><th>합계</th><th class="num">${cl.length}</th><th class="num">${num(tot)}</th><th class="num">${sub}/${cl.length}</th></tr></table>
   <p class="muted">초기 회원 수 출처: <a href="${SEED_META.source_url}" target="_blank" rel="noopener">3610지구 홈페이지 클럽별검색</a> (기준 ${SEED_META.as_of}). 클럽 보고 파일을 받으면 그 클럽 회원 수로 갱신됩니다.</p></div></div>`;
  bindChecks();};

  $('#drCsv').onclick=()=>dl(`${S().district}지구_월간보고_${drMonth}.csv`,toCsv([['지역','클럽','제출','정회원','신입','퇴회','주회','출석률','기부USD','기부KRW','신입명단','퇴회명단','비고'],...DB.d.clubs.map(c=>{const r=rep[c.code],d=r?.data||{};return [c.region,c.name,r?'Y':'N',d.memberCount??'',(d.newMembers||[]).length||'',(d.leftMembers||[]).length||'',d.meetings??'',d.attendanceRate??'',d.donationsUSD??'',d.donationsKRW??'',(d.newMembers||[]).join(' '),(d.leftMembers||[]).join(' '),d.note||'']})]),'text/csv');
  $$('[data-e]').forEach(b=>b.onclick=()=>reportForm(b.dataset.e));};
function reportForm(code){const c=DB.d.clubs.find(x=>x.code===code);const r=(DB.d.reports[drMonth]||{})[code];const d=r?.data||{memberCount:c.members,newMembers:[],leftMembers:[],meetings:'',attendanceRate:'',donationsUSD:0,note:''};
  openModal(`<h2>${esc(c.name)} · ${drMonth} 보고</h2>${r?`<p class="muted">접수 ${esc(r.at)} (${r.via==='file'?'파일':'수기'})</p>`:''}
   <div class="g3"><div><label>정회원</label><input id="qM" type="number" value="${d.memberCount??''}"></div><div><label>정기주회 횟수</label><input id="qG" type="number" value="${d.meetings??''}"></div><div><label>출석률(%)</label><input id="qA" type="number" step="0.1" value="${d.attendanceRate??''}"></div>
   <div><label>신입 명단 (쉼표)</label><input id="qN" value="${esc((d.newMembers||[]).join(', '))}"></div><div><label>퇴회 명단 (쉼표)</label><input id="qL" value="${esc((d.leftMembers||[]).join(', '))}"></div><div><label>기부 USD</label><input id="qD" type="number" step="0.01" value="${d.donationsUSD??0}"></div></div>
   ${(d.activities||[]).length?`<p class="muted">주요 활동: ${esc(d.activities.join(' / '))}</p>`:''}
   <label style="margin-top:8px">비고</label><textarea id="qNo">${esc(d.note||'')}</textarea>
   <div class="foot">${r?'<button class="btn r" id="qDel">제출 취소</button>':''}<button class="btn g" onclick="closeModal()">닫기</button><button class="btn" id="qOk">저장 (제출 처리)</button></div>`);
  const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);const nv=v=>v===''?null:+v;
  $('#qOk').onclick=()=>{const nd={...d,type:'rotary-club-monthly-report',clubCode:code,clubName:c.name,month:drMonth,memberCount:nv($('#qM').value),meetings:nv($('#qG').value),attendanceRate:nv($('#qA').value),newMembers:list($('#qN').value),leftMembers:list($('#qL').value),donationsUSD:+$('#qD').value||0,note:$('#qNo').value};
    (DB.d.reports[drMonth]||(DB.d.reports[drMonth]={}))[code]={at:r?.at||today(),via:r?.via||'manual',data:nd};if(nd.memberCount){c.members=nd.memberCount;c.asOf=`${drMonth} 보고`}save();closeModal();render()};
  if(r)$('#qDel').onclick=()=>{if(!confirm('제출 기록을 지울까요?'))return;delete DB.d.reports[drMonth][code];save();closeModal();render()};}

/* ============ 지구: 분담금 ============ */
let dfY=ry();
VIEWS.dfees=()=>{const fy=DB.d.fees[dfY]||(DB.d.fees[dfY]={perHead:0,extra:0,basis:'현재 회원 수',byClub:{}});
  const rows=DB.d.clubs.map(c=>{const due=(+fy.perHead||0)*(+c.members||0)+(+fy.extra||0);const p=fy.byClub[c.code]||{};return {c,due,paid:+p.paid||0,at:p.at||'',memo:p.memo||''}});
  const T=rows.reduce((a,r)=>({due:a.due+r.due,paid:a.paid+r.paid}),{due:0,paid:0});const un=rows.filter(r=>r.due>r.paid);
  $('#main').innerHTML=`<div class="card"><div class="row"><label style="margin:0">로타리연도</label><input id="fY" value="${dfY}" style="width:100px">
   <label style="margin:0">1인당</label><input id="fP" type="number" step="1000" value="${fy.perHead}" style="width:120px"><label style="margin:0">클럽당 정액</label><input id="fE" type="number" step="1000" value="${fy.extra||0}" style="width:120px">
   <button class="btn" id="fSave">기준 저장</button><button class="btn g" id="fUn">미납 안내문 복사 (${un.length})</button><button class="btn g" id="fCsv">CSV</button></div>
   <div class="note">청구액 = 1인당 금액 × 클럽 회원 수 + 클럽당 정액. 회원 수는 「클럽 현황」 값을 씁니다. 지구 예산서·결의 기준과 맞춰 입력하세요.</div>
   <div class="stats" style="margin-top:10px"><div class="stat"><span>청구 합계</span><b>${won(T.due)}</b></div><div class="stat"><span>수납</span><b style="color:var(--ok)">${won(T.paid)}</b></div><div class="stat"><span>미수</span><b style="color:var(--red)">${won(T.due-T.paid)}</b></div><div class="stat"><span>수납률</span><b>${T.due?Math.round(T.paid/T.due*100)+'%':'-'}</b></div></div>
   <div class="scroll"><table><tr><th>지역</th><th>클럽</th><th class="num">회원</th><th class="num">청구</th><th>납부액</th><th>납부일</th><th class="num">잔액</th><th>메모</th></tr>
   ${rows.map(r=>`<tr><td>${esc(r.c.region)}</td><td>${esc(r.c.name)}</td><td class="num">${num(r.c.members)}</td><td class="num">${won(r.due)}</td><td><input type="number" step="10000" data-fp="${r.c.code}" value="${r.paid||''}" style="width:130px"></td><td><input type="date" data-fa="${r.c.code}" value="${r.at}" style="width:150px"></td><td class="num" style="${r.due>r.paid?'color:var(--red)':''}">${won(r.due-r.paid)}</td><td><input data-fm="${r.c.code}" value="${esc(r.memo)}"></td></tr>`).join('')}</table></div>
   <div class="foot"><button class="btn" id="fPay">납부 내역 저장</button></div></div>`;
  $('#fY').onchange=e=>{dfY=e.target.value.trim()||ry();VIEWS.dfees()};
  $('#fSave').onclick=()=>{fy.perHead=+$('#fP').value||0;fy.extra=+$('#fE').value||0;save();VIEWS.dfees();toast('기준 저장')};
  $('#fPay').onclick=()=>{$$('[data-fp]').forEach(i=>{const k=i.dataset.fp;const v=+i.value||0,a=$(`[data-fa="${k}"]`).value,m=$(`[data-fm="${k}"]`).value;if(v||a||m)fy.byClub[k]={paid:v,at:a||(v?today():''),memo:m};else delete fy.byClub[k]});save();VIEWS.dfees();toast('저장했습니다')};
  $('#fUn').onclick=()=>{if(!un.length)return toast('미납 클럽이 없습니다');copyText(un.map(r=>`[${S().district}지구 사무국] ${r.c.name} ${dfY} 지구 분담금 미납액 ${won(r.due-r.paid)} 안내드립니다.${S().bank?' 입금 계좌: '+S().bank:''}`).join('\n\n'))};
  $('#fCsv').onclick=()=>dl(`${S().district}지구_분담금_${dfY}.csv`,toCsv([['지역','클럽','회원','청구','납부','납부일','잔액','메모'],...rows.map(r=>[r.c.region,r.c.name,r.c.members,r.due,r.paid,r.at,r.due-r.paid,r.memo])]),'text/csv');};

/* ============ 지구: 행사 참가 집계 ============ */
VIEWS.devents=()=>{const ev=DB.d.events.slice().sort((a,b)=>b.date.localeCompare(a.date));
  $('#main').innerHTML=`<div class="card"><div class="row"><h3 style="margin:0">행사 참가 신청 집계</h3><button class="btn" id="veAdd" style="margin-left:auto">＋ 행사</button></div>
   <table style="margin-top:10px"><tr><th>날짜</th><th>행사</th><th class="num">1인 참가비</th><th class="num">신청 클럽</th><th class="num">총 인원</th><th class="num">참가비 합계</th><th></th></tr>
   ${ev.map(e=>{const v=Object.values(e.byClub||{});const n=v.reduce((a,x)=>a+(+x.count||0),0);return `<tr><td>${e.date}</td><td>${esc(e.title)}</td><td class="num">${won(e.fee)}</td><td class="num">${v.filter(x=>+x.count).length}/${DB.d.clubs.length}</td><td class="num">${num(n)}</td><td class="num">${won(n*(+e.fee||0))}</td><td><button class="btn g sm" data-e="${e.id}">집계</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">행사가 없습니다.</td></tr>'}</table></div>`;
  $('#veAdd').onclick=()=>devForm();$$('[data-e]').forEach(b=>b.onclick=()=>devForm(b.dataset.e));};
function devForm(id){const e=id?DB.d.events.find(x=>x.id===id):{id:uid(),title:'',date:today(),place:'',fee:0,byClub:{}};const regions=[...new Set(DB.d.clubs.map(c=>c.region))];
  openModal(`<h2>${id?esc(e.title):'행사 등록'}</h2><div class="g3"><div><label>행사명</label><input id="xT" value="${esc(e.title)}" placeholder="예: 지구대회"></div><div><label>날짜</label><input id="xD" type="date" value="${e.date}"></div><div><label>1인 참가비</label><input id="xF" type="number" step="1000" value="${e.fee}"></div></div>
   <div class="scroll" style="max-height:380px;margin-top:10px"><table><tr><th>클럽</th><th>인원</th><th>납부</th><th>메모</th></tr>
   ${regions.map(r=>`<tr><th colspan="4">${esc(r)}</th></tr>`+DB.d.clubs.filter(c=>c.region===r).map(c=>{const b=e.byClub[c.code]||{};return `<tr><td>${esc(c.name)}</td><td><input type="number" min="0" data-xc="${c.code}" value="${b.count||''}" style="width:80px"></td><td><input type="checkbox" data-xp="${c.code}" style="width:auto" ${b.paid?'checked':''}></td><td><input data-xm="${c.code}" value="${esc(b.memo||'')}"></td></tr>`}).join('')).join('')}</table></div>
   <div class="foot">${id?'<button class="btn r" id="xDel">삭제</button>':''}<button class="btn g" id="xMiss">미신청 클럽 복사</button><button class="btn g" onclick="closeModal()">닫기</button><button class="btn" id="xOk">저장</button></div>`);
  $('#xOk').onclick=()=>{e.title=$('#xT').value.trim()||'행사';e.date=$('#xD').value;e.fee=+$('#xF').value||0;e.byClub={};
    $$('[data-xc]').forEach(i=>{const k=i.dataset.xc,c=+i.value||0,p=$(`[data-xp="${k}"]`).checked,m=$(`[data-xm="${k}"]`).value;if(c||p||m)e.byClub[k]={count:c,paid:p,memo:m}});
    if(!id)DB.d.events.push(e);save();closeModal();render()};
  $('#xMiss').onclick=()=>copyText(`[${S().district}지구 사무국] 「${$('#xT').value}」(${$('#xD').value}) 참가 신청 안내\n아직 신청하지 않은 클럽: `+$$('[data-xc]').filter(i=>!(+i.value)).map(i=>DB.d.clubs.find(c=>c.code===i.dataset.xc)?.name).join(', '));
  if(id)$('#xDel').onclick=()=>{if(!confirm('삭제할까요?'))return;DB.d.events=DB.d.events.filter(x=>x.id!==id);save();closeModal();render()};}

/* ============ 설정·백업 (공용) ============ */
VIEWS.set=()=>{const s=S(),isD=s.mode==='district';const list=isD?DB.d.checklist:s.checklist;
  $('#main').innerHTML=`<div class="card"><h3>기본 정보</h3><div class="g3">
   <div><label>클럽명 (클럽 모드)</label><input id="sC" value="${esc(s.clubName)}" list="clubList"><datalist id="clubList">${DB.d.clubs.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div>
   <div><label>클럽 코드 (지구 보고 매칭용)</label><input id="sCC" value="${esc(s.clubCode)}"></div><div><label>지구 번호</label><input id="sD" value="${esc(s.district)}"></div>
   <div><label>입금 계좌 (안내문에 표시)</label><input id="sB" value="${esc(s.bank)}" placeholder="예: 농협 000-0000-0000 순천중앙RC"></div>
   <div><label>규정집 주소</label><input id="sR" value="${esc(s.rulesUrl)}"></div><div><label>지구 홈페이지</label><input id="sH" value="${esc(s.districtUrl)}"></div>
   <div><label>잠금 PIN (비우면 해제, 10분 미사용 시 잠김)</label><input id="sPin" type="password" inputmode="numeric" value="${esc(s.pin)}"></div></div>
   <p class="muted">클럽명을 목록에서 고르면 코드가 자동으로 채워집니다.</p><div class="foot"><button class="btn" id="sOk">저장</button></div></div>
  <div class="card"><h3>${isD?'지구 사무국':'클럽 사무장'} 월간 할 일 항목</h3><p class="muted">한 줄에 하나: <b>매월 기한일,할 일</b> (예: 5,월간 출석 보고 작성·제출). 기본 항목은 예시이니 지구 공문 기준으로 고치세요.</p>
   <textarea id="sL" style="min-height:150px">${list.map(t=>`${t.day},${t.title}`).join('\n')}</textarea><div class="foot"><button class="btn" id="sLOk">할 일 저장</button></div></div>
  <div class="card"><h3>백업·옮기기</h3><p class="muted">데이터는 <b>이 PC의 이 브라우저에만</b> 저장되고 외부로 전송되지 않습니다. 브라우저 기록 삭제 시 사라지니 매주 백업 파일을 받아 두세요. 사무장 교체 때는 백업 파일을 넘기면 그대로 이어집니다.</p>
   <div class="row"><button class="btn" id="bE">전체 백업 받기</button><button class="btn g" id="bI">백업 불러오기</button><button class="btn r" id="bR">전체 초기화</button></div></div>`;
  $('#sC').onchange=()=>{const c=DB.d.clubs.find(x=>x.name===$('#sC').value);if(c)$('#sCC').value=c.code};
  $('#sOk').onclick=()=>{Object.assign(s,{clubName:$('#sC').value.trim(),clubCode:$('#sCC').value.trim(),district:$('#sD').value.trim(),bank:$('#sB').value.trim(),rulesUrl:$('#sR').value.trim(),districtUrl:$('#sH').value.trim(),pin:$('#sPin').value.trim()});save();render();toast('저장했습니다')};
  $('#sLOk').onclick=()=>{const out=[];for(const l of $('#sL').value.split('\n').map(x=>x.trim()).filter(Boolean)){const i=l.indexOf(',');const day=+l.slice(0,i);const title=l.slice(i+1).trim();if(i<0||!day||day>31||!title)return alert('형식 오류: '+l);out.push({id:(isD?'d':'c')+uid(),day,title})}
    if(isD)DB.d.checklist=out;else s.checklist=out;save();render();toast('할 일 저장')};
  $('#bE').onclick=()=>dl(`로타리사무국_백업_${today()}.json`,JSON.stringify(DB),'application/json');
  $('#bI').onclick=()=>pickFiles('.json',false,async fs=>{try{const d=JSON.parse(await readText(fs[0]));if(!d.settings||!d.members)throw 0;if(!confirm('현재 데이터를 백업 내용으로 바꿉니다. 계속할까요?'))return;localStorage.setItem(KEY,JSON.stringify(d));load();render();toast('불러오기 완료')}catch(e){alert('올바른 백업 파일이 아닙니다')}});
  $('#bR').onclick=()=>{if(prompt('모든 데이터를 지웁니다. 계속하려면 "초기화"를 입력하세요')!=='초기화')return;DB=defaults();save();render()};};

/* ============ 잠금 ============ */
function lockCheck(){if(!S().pin)return;$('#lock').style.display='flex';$('#lockPin').focus();
  const go=()=>{if($('#lockPin').value===S().pin){$('#lock').style.display='none';$('#lockPin').value=''}else toast('PIN이 틀렸습니다')};
  $('#lockBtn').onclick=go;$('#lockPin').onkeydown=e=>{if(e.key==='Enter')go()}}
let idle=Date.now();['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>idle=Date.now()));
setInterval(()=>{if(S().pin&&Date.now()-idle>10*60e3&&$('#lock').style.display!=='flex')lockCheck()},5000);
render();lockCheck();
</script>
</body>
</html>
